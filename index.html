<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Static Node.js App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Welcome to Your Static Node.js App</h1>
    <p class="subtitle">Served with pure Node.js &mdash; zero external dependencies required!</p>
    
    <div class="card">
      <h2>Project Details</h2>
      <ul>
        <li><strong>Entry File:</strong> <code>app.js</code></li>
        <li><strong>Config:</strong> <code>package.json</code></li>
        <li><strong>Static Assets:</strong> <code>public/</code></li>
      </ul>
    </div>

    <div class="card">
      <h2>Quick Commands</h2>
      <pre><code>npm start</code></pre>
      <p>or</p>
      <pre><code>node app.js</code></pre>
    </div>
  </div>
</body>
</html>
